<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthGuard-AI</title>

    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <div class="header">

            <div class="title-section">
                <h1>🩺 HealthGuard-AI</h1>
                <p>AI Powered Diabetes Prediction System</p>
            </div>

            <div class="nav-buttons">

                <button
                    type="button"
                    class="history-btn"
                    onclick="window.location.href='pages/history.html'">
                    📜 History
                </button>

                <button
                    type="button"
                    class="logout-btn"
                    onclick="logout()">
                    🚪 Logout
                </button>

            </div>

        </div>

        <!-- Prediction Form -->
        <form id="predictionForm">

            <input
                type="number"
                id="Pregnancies"
                placeholder="Pregnancies"
                required>

            <input
                type="number"
                id="Glucose"
                placeholder="Glucose Level"
                required>

            <input
                type="number"
                id="BloodPressure"
                placeholder="Blood Pressure"
                required>

            <input
                type="number"
                id="SkinThickness"
                placeholder="Skin Thickness"
                required>

            <input
                type="number"
                id="Insulin"
                placeholder="Insulin Level"
                required>

            <input
                type="number"
                step="0.1"
                id="BMI"
                placeholder="BMI"
                required>

            <input
                type="number"
                step="0.001"
                id="DiabetesPedigreeFunction"
                placeholder="Diabetes Pedigree Function"
                required>

            <input
                type="number"
                id="Age"
                placeholder="Age"
                required>

            <button type="submit">
                Predict
            </button>

        </form>

        <!-- Prediction Result -->
        <div id="result" class="result-box"></div>

    </div>

    <script>
        function logout() {

            localStorage.removeItem("user");

            window.location.href = "pages/login.html";

        }
    </script>

    <script src="js/prediction.js"></script>

</body>

</html>
