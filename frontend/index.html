<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HealthGuard-AI</title>

    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

<div class="container">

    <h1>🩺 HealthGuard-AI</h1>

    <p>
        AI Powered Diabetes Prediction System
    </p>

    <form id="predictionForm">

        <input type="number" id="Pregnancies" placeholder="Pregnancies" required>

        <input type="number" id="Glucose" placeholder="Glucose Level" required>

        <input type="number" id="BloodPressure" placeholder="Blood Pressure" required>

        <input type="number" id="SkinThickness" placeholder="Skin Thickness" required>

        <input type="number" id="Insulin" placeholder="Insulin Level" required>

        <input type="number" step="0.1" id="BMI" placeholder="BMI" required>

        <input
        type="number"
        step="0.001"
        id="DiabetesPedigreeFunction"
        placeholder="Diabetes Pedigree Function"
        required>

        <input type="number" id="Age" placeholder="Age" required>

        <button type="submit">
            Predict
        </button>

    </form>

    <div id="result" class="result-box">

</div>

</div>

<script src="js/prediction.js"></script>

</body>
</html>
