<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Prediction History | HealthGuard-AI</title>

    <link rel="stylesheet" href="../css/history.css">

</head>

<body>

    <div class="container">

        <div class="header">

            <div>

                <h1>🩺 Prediction History</h1>

                <p>View all your previous diabetes predictions.</p>

            </div>

            <div class="header-buttons">

                <button
                    class="dashboard-btn"
                    onclick="window.location.href='../index.html'">

                    🏠 Dashboard

                </button>

                <button
                    class="logout-btn"
                    onclick="logout()">

                    🚪 Logout

                </button>

            </div>

        </div>

        <div id="historyContainer">

            <div class="loading">

                Loading prediction history...

            </div>

        </div>

    </div>

    <script>

        function logout() {

            localStorage.removeItem("user");

            window.location.href = "login.html";

        }

    </script>

    <script src="../js/history.js"></script>

</body>

</html>
